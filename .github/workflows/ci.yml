name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weddingexam-jar
          path: target/*.jar
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, wedding-card-deploy]

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: weddingexam-jar
          path: /home/ubuntu/Wedding-Card/target

      - name: Restart service
        run: |
          sudo systemctl stop weddingcard.service 2>/dev/null || true
          pkill -f 'java -jar target/weddingexam' 2>/dev/null || true
          sleep 5
          # 배포 직전 DB 백업 — 서비스가 멈춘 상태라 H2 파일이 일관된 상태로 복사된다. 최근 14개만 남긴다.
          BK=/home/ubuntu/backups/deploy_$(TZ=Asia/Seoul date +%Y%m%d_%H%M%S)
          mkdir -p "$BK" && cp -p /home/ubuntu/Wedding-Card/data/*.db "$BK"/ && ls -la "$BK"
          ls -1dt /home/ubuntu/backups/deploy_* | tail -n +15 | xargs -r rm -rf
          sudo systemctl start weddingcard.service

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            sleep 3
          done
          echo "Service failed to start" >&2
          sudo journalctl -u weddingcard.service -n 50 --no-pager
          exit 1
