name: db-backup

# 운영 DB 백업 — 운영은 H2 파일 DB(/home/ubuntu/Wedding-Card/data/wedding-db.mv.db)를 쓴다.
# 서버(self-hosted runner)에서 그 파일을 /home/ubuntu/backups 로 복사한다.
on:
  workflow_dispatch:
  push:
    branches: [ops/db-backup]

jobs:
  backup:
    runs-on: [self-hosted, wedding-card-deploy]
    steps:
      - name: Copy H2 DB file
        run: |
          SRC=/home/ubuntu/Wedding-Card/data
          DST=/home/ubuntu/backups/manual_$(TZ=Asia/Seoul date +%Y%m%d_%H%M)
          mkdir -p "$DST"
          cp -p "$SRC"/*.db "$DST"/
          ls -la "$DST"
          sha256sum "$SRC"/wedding-db.mv.db "$DST"/wedding-db.mv.db
