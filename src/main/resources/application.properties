# 서버 포트
server.port=8080

# 로컬 전용 시크릿 파일 (git에 커밋되지 않음, 없어도 기동은 됨)
spring.config.import=optional:classpath:application-secret.properties

# 카카오 API 키 (환경변수로 주입 — 절대 커밋하지 말 것)
kakao.map.appkey=${KAKAO_MAP_APPKEY:}
kakao.map.restkey=${KAKAO_REST_API_KEY:}

# 정적 파일 캐시 무효화 — @{/css/..}, @{/js/..} 주소에 파일 내용 해시를 붙인다 (editor-3f2a….css).
# 예전엔 버전 표시가 없거나(editor.css) 손으로 박은 값(invitation.js?v=20260629)이라
# 배포 후에도 브라우저가 옛 CSS/JS 를 계속 쓸 수 있었다. 내용이 바뀌면 주소가 바뀌므로 그럴 일이 없다.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# H2 파일 기반 DB (재시작해도 유지)
spring.datasource.url=jdbc:h2:file:./data/wedding-db;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔 — 기본 비활성화.
# 예전엔 여기가 true라서 프로덕션에서 /h2-console/ 이 로그인 없이 열려 있었다
# (서버 실행 커맨드에 --spring.profiles.active=prod 가 없어 application-prod.properties의
#  enabled=false 가 적용된 적이 없었음). 로컬에서 쓰려면 H2_CONSOLE_ENABLED=true 로 띄울 것.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 파일 업로드
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── 카카오 OAuth2 로그인 ──────────────────────────────────────
# 카카오 디벨로퍼(developers.kakao.com) > 내 애플리케이션 > REST API 키 (환경변수로 주입)
kakao.oauth.client-id=${KAKAO_REST_API_KEY:}
# 보안 메뉴에서 Client Secret 활성화한 경우 환경변수로 주입 (없으면 비워두세요)
kakao.oauth.client-secret=${KAKAO_CLIENT_SECRET:}

spring.security.oauth2.client.registration.kakao.client-id=${kakao.oauth.client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${kakao.oauth.client-secret}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=카카오
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 응답 압축 (HTML/CSS/JS/JSON) — 텍스트 리소스 전송량을 크게 줄인다
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# 정적 리소스 브라우저 캐시 — css/js 는 파일명에 내용 해시가 붙으므로 바뀌면 URL 자체가 달라진다
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
